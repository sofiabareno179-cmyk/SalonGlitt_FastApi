# SGE-API · orquestación con un solo servicio: la API.
#
# La base de datos NO vive aquí. Es un recurso administrado por Coolify y la API
# la alcanza por la red interna compartida `coolify`, que se declara más abajo
# como externa. El hostname de la base (postgres-db-...) solo resuelve dentro de
# esa red; no se puede usar `localhost` ni la IP del servidor.
#
# Antes de la primera vez:
#   1. copie .env.example como .env y rellene SGE_SECRET_KEY y SGE_DATABASE_URL
#   2. `docker compose up --build`
#
# La API queda en http://localhost:8025 y la documentación en .../docs.
#
# Este archivo también es el que lee Coolify al desplegar, así que está escrito
# para las dos plataformas a la vez. La diferencia está en quién resuelve las
# variables `${...}`:
#
#   - local: Compose las lee sola del .env del proyecto.
#   - Coolify: las declara en la pestaña Environment Variables del recurso, y
#     `${VARIABLE:?}` aparece ahí como obligatoria, resaltada en rojo y
#     bloqueando el despliegue mientras esté vacía.
#
# Por eso abajo NO hay `env_file:`. El .env está en .gitignore, o sea que no
# viaja al repositorio que clona Coolify: un `env_file: - .env` dejaba al
# contenedor sin SGE_SECRET_KEY y el proceso moría al importar los settings.
#
# Y por eso tampoco hay `ports:` en el servicio. Publicar un puerto en el host no
# sirve de nada en un despliegue --el proxy llega al contenedor por la red
# interna-- y sí resulta dañino: el 5434 del servidor ya estaba ocupado y el
# despliegue moría con «Bind for 127.0.0.1:5434 failed: port is already
# allocated». Para desarrollo local, el puerto está en
# docker-compose.override.yml, que Coolify no lee porque invoca
# `docker compose -f docker-compose.yml`.

name: sge-api

services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Todas por interpolación, sin literales. Cada una queda editable en la
      # pestaña Environment Variables de Coolify, y ninguna se versiona.
      #
      # SGE_SECRET_KEY no lleva default a propósito, ni aquí ni en
      # app/core/config.py: si falta, la aplicación no arranca. Es un fallo
      # ruidoso el primer día, y vale más que una filtración silenciosa el día
      # 80. El `:?` le dice a Coolify que no la deje vacía.
      SGE_SECRET_KEY: ${SGE_SECRET_KEY:?falta SGE_SECRET_KEY en Environment Variables}
      SGE_DEBUG: ${SGE_DEBUG:-false}
      SGE_ACCESS_TOKEN_EXPIRE_MINUTES: ${SGE_ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # Obligatoria y sin default: la base ya no es un servicio de este compose,
      # sino el recurso administrado de Coolify, y su hostname solo existe dentro
      # de la red `coolify` de más abajo. Sin `:?`, un despliegue sin esta
      # variable arrancaría apuntando a un host que no resuelve y fallaría en la
      # primera consulta en lugar de detenerse de forma ruidosa.
      #
      # Recuerde: prefijo `SGE_` (un `DATABASE_URL` a secas se ignora), driver
      # `postgresql+asyncpg` (no `psycopg2`, que no está instalado) y URL-encoder
      # la contraseña si contiene `@`, `:`, `/` o `#`.
      SGE_DATABASE_URL: ${SGE_DATABASE_URL:?falta SGE_DATABASE_URL en Environment Variables}

      # Orígenes del navegador. Sin esto, el panel de React servido desde el
      # dominio de producción recibe un error de CORS en cada llamada, porque la
      # lista de desarrollo no incluye ese dominio. Formato: JSON o lista con
      # comas. Vacío (o sin declarar) cae en los orígenes de desarrollo; nunca
      # cierra el CORS, que sería el fallo más difícil de ver: /health seguiría
      # verde mientras el panel recibe 403 de origen.
      SGE_CORS_ORIGINS: ${SGE_CORS_ORIGINS:-}

      # Vacío en el caso normal. Solo si el proxy publica la API bajo un prefijo
      # de ruta (https://dominio/api), y entonces debe coincidir con ese prefijo
      # para que Swagger genere URL correctas.
      SGE_ROOT_PATH: ${SGE_ROOT_PATH:-}
    # Sin `ports:` a propósito: en un despliegue el proxy de Coolify alcanza el
    # contenedor por la red interna y no necesita que el puerto esté publicado en
    # el host. Publicarlo reserva un puerto del servidor que puede estar ocupado,
    # que es exactamente el fallo que paró este despliegue.
    #
    # `expose` sí se queda: no publica nada, pero documenta el puerto y es lo que
    # le dice al proxy a dónde enviar el tráfico. El dominio en Coolify lleva el
    # sufijo `:8025` por la misma razón.
    expose:
      - "8025"
    networks:
      # Red compartida de Coolify. En ella viven tanto este contenedor como el
      # recurso de la base de datos, así que el hostname de la base resuelve.
      # En el panel, esto equivale a activar «Connect To Predefined Network» en
      # Configuration > Advanced.
      - coolify

networks:
  coolify:
    # La crea Coolify en el servidor; este archivo solo se une a ella. No la
    # define como local para no crear una red propia que aislaría la API del
    # recurso de la base. En desarrollo local, créela una vez con
    # `docker network create coolify` antes de `docker compose up`.
    external: true
    name: coolify
