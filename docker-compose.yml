# SGE-API · orquestación local con dos servicios: la API y su base de datos.
#
# Antes de la primera vez:
#   1. copie .env.example como .env y rellene SGE_SECRET_KEY
#   2. `docker compose up --build`
#
# La API queda en http://localhost:8025 y la documentación en .../docs.
#
# Este archivo también es el que lee Coolify al desplegar, así que está escrito
# para las dos plataformas a la vez. La diferencia está en quién resuelve las
# variables `${...}`:
#
#   - local: Compose las lee sola del .env del proyecto.
#   - Coolify: las declara en la pestaña Environment Variables del recurso, y
#     `${VARIABLE:?}` aparece ahí como obligatoria, resaltada en rojo y
#     bloqueando el despliegue mientras esté vacía.
#
# Por eso abajo NO hay `env_file:`. El .env está en .gitignore, o sea que no
# viaja al repositorio que clona Coolify: un `env_file: - .env` dejaba al
# contenedor sin SGE_SECRET_KEY y el proceso moría al importar los settings.
#
# Y por eso tampoco hay `ports:` en ningún servicio. Publicar un puerto en el
# host no sirve de nada en un despliegue --el proxy llega al contenedor por la
# red interna-- y sí resulta dañino: el 5434 del servidor ya estaba ocupado y el
# despliegue moría con «Bind for 127.0.0.1:5434 failed: port is already
# allocated». Para desarrollo local, los puertos están en
# docker-compose.override.yml, que Coolify no lee porque invoca
# `docker compose -f docker-compose.yml`.

name: sge-api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sge}
      # Default solo para desarrollo, y con el servicio sin puerto publicado: sin
      # `ports` esta base solo es alcanzable desde la red de Compose, así que la
      # contraseña no sale del servidor. No es un default aceptable si algún día
      # se publica el puerto; por eso el comentario.
      #
      # Sin `:?` a propósito, porque este servicio también arranca cuando la API
      # usa una base administrada por Coolify (SGE_DATABASE_URL en el panel), y
      # una variable obligatoria que no aplica bloquearía el despliegue entero.
      # Para ese escenario, este servicio sobra: borre el bloque `db` del
      # compose y quite el `depends_on` de más abajo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sge-dev-local-2026}
      POSTGRES_DB: ${POSTGRES_DB:-sge}
    # Sin `ports:` a propósito. El 5434 del host era para que `psql` del
    # computador de quien desarrolla pudiera conectarse, y en un servidor de
    # despliegue no aporta nada: la API habla con este servicio por la red
    # interna como `db:5432`. Publicado, solo producía el error «port is already
    # allocated» cuando algo en el servidor ya ocupaba el 5434. Quien quiera
    # abrirlo en local lo tiene en docker-compose.override.yml.
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      # Sin este chequeo, la API puede arrancar contra un servidor que todavía
      # no acepta conexiones. `depends_on: service_healthy` de abajo espera a que
      # responda en lugar de esperar un tiempo fijo y adivinar.
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-sge}" -d "${POSTGRES_DB:-sge}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      # Solo espera a la base local. Si Coolify declara SGE_DATABASE_URL para
      # usar una base administrada, esta dependencia es un retardo
      # innecesario --la API no hablará con `db`-- pero no un fallo: el
      # `condition` permite que el despliegue continúe igual.
      db:
        condition: service_healthy
    environment:
      # Todas por interpolación, sin literales. Cada una queda editable en la
      # pestaña Environment Variables de Coolify, y ninguna se versiona.
      #
      # SGE_SECRET_KEY no lleva default a propósito, ni aquí ni en
      # app/core/config.py: si falta, la aplicación no arranca. Es un fallo
      # ruidoso el primer día, y vale más que una filtración silenciosa el día
      # 80. El `:?` le dice a Coolify que no la deje vacía.
      SGE_SECRET_KEY: ${SGE_SECRET_KEY:?falta SGE_SECRET_KEY en Environment Variables}
      SGE_DEBUG: ${SGE_DEBUG:-false}
      SGE_ACCESS_TOKEN_EXPIRE_MINUTES: ${SGE_ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # Interpolada y no literal, a propósito. Con la URL escrita aquí tal cual,
      # esta línea pisaba cualquier SGE_DATABASE_URL que se declarase en la
      # pestaña Environment Variables de Coolify: el `environment` de Compose
      # gana al --env-file, así que una base administrada por Coolify se
      # aceptaba en el panel y luego se ignoraba por completo, con la API
      # conectada a un PostgreSQL vacío.
      #
      # El valor por defecto sigue siendo `db:5432`, el servicio de más abajo,
      # que es lo que se usa en local y en un despliegue sin base externa.
      SGE_DATABASE_URL: ${SGE_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sge}:${POSTGRES_PASSWORD:-sge}@db:5432/${POSTGRES_DB:-sge}}

      # Orígenes del navegador. Sin esto, el panel de React servido desde el
      # dominio de producción recibe un error de CORS en cada llamada, porque la
      # lista de desarrollo no incluye ese dominio. Formato: JSON o lista con
      # comas. Vacío (o sin declarar) cae en los orígenes de desarrollo; nunca
      # cierra el CORS, que sería el fallo más difícil de ver: /health seguiría
      # verde mientras el panel recibe 403 de origen.
      SGE_CORS_ORIGINS: ${SGE_CORS_ORIGINS:-}

      # Vacío en el caso normal. Solo si el proxy publica la API bajo un prefijo
      # de ruta (https://dominio/api), y entonces debe coincidir con ese prefijo
      # para que Swagger genere URL correctas.
      SGE_ROOT_PATH: ${SGE_ROOT_PATH:-}
    # Sin `ports:` por el mismo motivo que en `db`: en un despliegue el proxy de
    # Coolify alcanza el contenedor por la red interna y no necesita que el puerto
    # esté publicado en el host. Publicarlo reserva un puerto del servidor que
    # puede estar ocupado, que es exactamente el fallo que paró este despliegue.
    #
    # `expose` sí se queda: no publica nada, pero documenta el puerto y es lo que
    # le dice al proxy a dónde enviar el tráfico. El dominio en Coolify lleva el
    # sufijo `:8025` por la misma razón.
    expose:
      - "8025"

volumes:
  # Con nombre, no anónimo: `docker compose down` conserva los datos y solo
  # `docker compose down -v` los borra. Perder la base al reiniciar un servicio
  # sería peor que un directorio suelto ocupando espacio en el disco.
  postgres_datos: