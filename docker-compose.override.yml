# SGE-API · puerto para desarrollo local.
#
# Este archivo NO lo lee Coolify. Coolify invoca
# `docker compose -f docker-compose.yml`, y al pasar `-f` explícitamente se deja
# de buscar los archivos `override` automáticos. Eso es justo lo que se quiere
# aquí: en el servidor, ningún puerto debe publicarse en el host, y este archivo
# es el que se lo quitaría.
#
# `docker compose up --build` en cambio sí lo carga solo, y con esto la API
# sigue en http://localhost:8025, como documenta el README.
#
# La base de datos ya no es un servicio de este compose: es el recurso de
# Coolify y se alcanza por la red `coolify` (definida en docker-compose.yml).
# Antes de levantar en local, cree esa red una vez:
#   docker network create coolify
#
# El puerto va ligado a 127.0.0.1 a propósito: sin el prefijo, Docker lo publica
# en todas las interfaces y el servicio queda accesible desde la red local sin
# que nadie lo haya pedido.
services:
  api:
    ports:
      - "127.0.0.1:${SGE_PUERTO:-8025}:8025"
